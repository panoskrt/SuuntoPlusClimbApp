<uiView
onLoad="
    var categorySubscription;
    var g = typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : Function('return this')());
    g.g = g;

    g.category = 0; // Default to flat

    g.drawClimbingUI = function(ctx) {
      var cx = ctx.width / 2;
      var cy = ctx.width / 2;

      // 1. Draw top curved banner
      var r = ctx.width / 2 - 10; 
      var dy = 0.20 * ctx.width - cy; // Adjusted to make banner thinner
      if (r > Math.abs(dy)) {
        var end = Math.asin(dy / r);
        var start = -Math.PI - end;
        ctx.beginPath();
        ctx.arc(cx, cy, r, start, end, false);
        ctx.closePath();
        ctx.fillStyle = '#008000';
        ctx.fill();
      }
      
      // 2. Render the official 5-segment corona on top
      var climbingCategory = Number(g.category) || 0;

      // Manual 7-segment corona drawing
      var minValue = 0;
      var maxValue = 7;

      var startAngle = 3 * Math.PI / 4;
      var endAngle = 9 * Math.PI / 4;
      var totalAngle = endAngle - startAngle;
      var segmentAngle = totalAngle / maxValue;
      var gap = 0.06;
      var zColors = ['#DED943', '#005E1F', '#003DB8', '#AD9207', '#995D03', '#BD0202', '#800000'];
      
      ctx.lineCap = 'butt';
      for (var i = 0; i < maxValue; i++) {
        var sA = startAngle + i * segmentAngle + gap/2;
        var eA = startAngle + (i+1) * segmentAngle - gap/2;
        var isActive = (climbingCategory === i + 1);
        ctx.lineWidth = isActive ? 8 : 4;
        ctx.strokeStyle = isActive ? zColors[i] : '#666666';
        ctx.beginPath();
        ctx.arc(cx, cy, (ctx.width - ctx.lineWidth) / 2 - 2, sA, eA, false);
        ctx.stroke(); 
      }

      // 3. Draw Needle (Flecha) pointing to the current climbingCategory
      if (climbingCategory >= minValue && climbingCategory <= maxValue) {
        var nStart = 3 * Math.PI / 4;
        var nTotal = (9 * Math.PI / 4) - nStart;
        var nSeg = nTotal / maxValue;
        // Point exactly to the middle of the active climbingCategory
        var angle = nStart;
        if (climbingCategory > 0) {
          angle += (climbingCategory - 1) * nSeg + (nSeg / 2);
        }
        
        var rb = ctx.width / 2 - 2;  // Base of needle
        var rt = ctx.width / 2 - 20; // Tip of needle
        var bHalf = 0.055;

        var xTip = cx + rt * Math.cos(angle);
        var yTip = cy + rt * Math.sin(angle);
        var xBase1 = cx + rb * Math.cos(angle - bHalf);
        var yBase1 = cy + rb * Math.sin(angle - bHalf);
        var xBase2 = cx + rb * Math.cos(angle + bHalf);
        var yBase2 = cy + rb * Math.sin(angle + bHalf);

        ctx.beginPath();
        ctx.moveTo(xTip, yTip);
        ctx.lineTo(xBase1, yBase1);
        ctx.lineTo(xBase2, yBase2);
        ctx.closePath();
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    };
  "
  onActivate="
    var categoryInfo = [
      { text: 'Descent', color: '#0000FF' },
      { text: 'Flat', color: '#808080' }, 
      { text: 'Cat4', color: '#005E1F' },
      { text: 'Cat3', color: '#003DB8' },
      { text: 'Cat2', color: '#AD9207' },
      { text: 'Cat1', color: '#995D03' },
      { text: 'HC',   color: '#BD0202' },
      { text: 'HC+',  color: '#800000' }
    ];
    
    categorySubscription = $.subscribe('Zapp/{zapp_index}/Output/category', function(v) {
      var info = categoryInfo[v] || categoryInfo[0];
      setText('#category-value', info.text);
      setStyle('#category-value', 'color', info.color);
      g.category = Number(v) || 0;
    });
  "
  onDeactivate="$.unsubscribe(categorySubscription);">

  <div id="suuntoplus">

    <object type="canvas" id="climbGauge" style="position:absolute; top:0; left:0; width:100%; height:100%;" build="ctx => g.drawClimbingUI(ctx);" />

    <!-- Title and its background -->
        <div class="sp-t-m p-hc" style="top:calc(12% - 50%e); color:#000000; font-weight:bold; position:absolute; line-height:1; text-align:center;">
            Velo Climb
        </div>

    <!-- vertical separator -->
    <div class="cm-fg p-hc" style="top:32%;width:2px;height:43%;opacity:0.4"></div>

    <!-- Note!
      On large display icons are on the top of the value
      and on medium and small displays icons are on the left or right of the value
      in this layout
    -->

    <!-- top left -->
    <!-- Gradient -->
    <:if test="{APP_IS_DISPLAY_LARGE}">
        <div class="sp-d-m" style="top:calc(35% - 100%e);left:calc(26% - 50%e)">%</div>
        <div class="sp-d-m f-num" style="top:calc(41% - 50%e);left:calc(26% - 50%e)">
          <eval input="/Zapp/{zapp_index}/Output/gradient" outputFormat="Percentage_Fourdigits" default="--"/>
        </div>
    </:if>
    <:else>
        <div style="top:26%;left:3%;width:46%;height:30%">
          <div class="p-hc sp-vertical-center">
            <span class="sp-d-s" style="padding-right:4px; font-size:20px;">%</span>
            <span class="sp-d-s f-num">
              <eval input="/Zapp/{zapp_index}/Output/gradient" outputFormat="Percentage_Fourdigits" default="--"/>
            </span>
          </div>
        </div>
    </:else>

    <!-- top right -->
    <!-- VAM -->
    <:if test="{APP_IS_DISPLAY_LARGE}">    
        <div class="f-ico" style="top:calc(35% - 100%e);left:calc(74% - 50%e)">&#xF261;</div>
        <div class="sp-d-m f-num c-green" style="top:calc(41% - 50%e);left:calc(74% - 50%e)">
          <eval input="/Zapp/{zapp_index}/Output/vam" outputFormat="VerticalSpeedMountain_Fourdigits" default="--"/>
        </div>
    </:if>
    <:else>
        <div style="top:26%;left:51%;width:46%;height:30%">
          <div class="p-hc sp-vertical-center">
            <span class="sp-d-s f-num" style="color:rgb(255, 0, 0);">
              <eval input="/Zapp/{zapp_index}/Output/vam" outputFormat="VerticalSpeedMountain_Fourdigits" default="--"/>
            </span>
            <span class="f-ico" style="padding-left:4px">&#xF261;</span>
          </div>
        </div>   
    </:else>

    <!-- middle left -->
    <!-- Max gradient -->
    <:if test="{APP_IS_DISPLAY_LARGE}">    
        <div class="f-ico" style="top:calc(60% - 100%e);left:calc(26% - 50%e)">&#xF262;</div>
        <div class="sp-d-s f-num" style="top:calc(66% - 50%e);left:calc(26% - 50%e)">
          <eval input="/Zapp/{zapp_index}/Output/maxgradient" outputFormat="Percentage_Fourdigits" default="--"/>
        </div>
    </:if>
    <:else>
        <div style="top:48%;left:5%;width:43%;height:30%">
          <div class="p-hc sp-vertical-center">
            <span class="f-ico" style="padding-right:4px">&#xF262;</span>
            <span class="sp-d-s f-num">
              <eval input="/Zapp/{zapp_index}/Output/maxgradient" outputFormat="Percentage_Fourdigits" default="--"/>
            </span>
          </div>
        </div>
    </:else>

    <!-- middle right -->
    <!-- Total ascent -->
    <:if test="{APP_IS_DISPLAY_LARGE}">    
        <div class="f-ico" style="top:calc(60% - 100%e);left:calc(74% - 50%e)">&#xF263;</div>
        <div class="sp-d-s f-num" style="top:calc(66% - 50%e);left:calc(74% - 50%e)">
          <eval input="/Zapp/{zapp_index}/Output/totalAscent" outputFormat="Ascent_Fourdigits" default="--" />
        </div>
    </:if>
    <:else>
        <div style="top:48%;left:51%;width:48%;height:30%">
          <div class="p-hc sp-vertical-center">
            <span class="sp-d-s f-num">
              <eval input="/Zapp/{zapp_index}/Output/totalAscent" outputFormat="Ascent_Fourdigits" default="--" />
            </span>
            <span class="f-ico" style="padding-left:4px">&#xF263;</span>
          </div>
        </div>
    </:else>

    <!-- bottom middle -->
    <!-- Climb category -->
    <div class="sp-t-l p-hc" style="top:calc(80% - 50%e)">
      <span id="category-value" class="sp-t-l">--</span>
    </div>

    <div style="top:0; left:0; width:0px; height:0px; position:absolute;">
        <eval input="/Zapp/{zapp_index}/Output/category" outputFormat="script x => x" default="0" onValueChanged="g.category = Number(targetData) || 0; control('#climbGauge', 'REFRESH');" />
    </div>

    <userInput>
      <!-- Switch view when lower button is pressed -->
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');" />
    </userInput>

  </div>

</uiView>
