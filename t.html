<uiView
  onLoad="
    var categorySubscription;
  "
  onActivate="
    // Category text + color per tier, matching main.js's CLIMB_* comments:
    // gray -> green -> blue -> yellow -> orange -> red -> dark red.
    // Colors are hardcoded hex rather than looked up via getStyle('css:.c-x')
    // because not every watch display defines the same named color classes
    // (e.g. plain .c-blue is missing on the newer 'q' display's stylesheet).
    var categoryInfo = [
      { text: 'Flat', color: '#888' },
      { text: 'Cat4', color: '#0F5' },
      { text: 'Cat3', color: '#05F' },
      { text: 'Cat2', color: '#FD3' },
      { text: 'Cat1', color: '#F90' },
      { text: 'HC',   color: '#F00' },
      { text: 'HC+',  color: '#900' }
    ];
    categorySubscription = $.subscribe('Zapp/{zapp_index}/Output/category', function(v) {
      var info = categoryInfo[v] || categoryInfo[0];
      setText('#category-value', info.text);
      setStyle('#category-value', 'color', info.color);
    });
  "
  onDeactivate="
    $.unsubscribe(categorySubscription);
  ">

  <div id="suuntoplus">

    <!-- Topmost: title field -->
    <div class="cm-fg" style="width:100%;height:25%;">
      <div class="sp-t-s p-hc" style="top:calc(60% - 50%e);">Cycling Climb Category</div>
    </div>

    <!-- Field just under the title, left side -->
    <!-- Field title -->
    <div class="cm-mid sp-t-s" style="top:calc(43% - 100%e);left:calc(26% - 50%e);">Gradient</div>
    <!-- Field value -->
    <div class="sp-d-s f-num" style="top:calc(61% - 100%e);left:calc(26% - 50%e);">
      <eval input="/Zapp/{zapp_index}/Output/gradient" outputFormat="Percentage_Fourdigits" default="--"/>
    </div>

    <!-- Field just under the title, right side -->
    <!-- Field title -->
    <div class="cm-mid sp-t-s" style="top:calc(43% - 100%e);left:calc(74% - 50%e);">VAM</div>
    <!-- Field value -->
    <div style="top:calc(61% - 100%e);left:calc(74% - 50%e);">
      <span class="sp-d-s f-num">
        <eval input="/Zapp/{zapp_index}/Output/vam" outputFormat="VerticalSpeedMountain_Fourdigits" default="--"/>
      </span>
    </div>

<div class="f-ico-m" style="top:calc(50% - 100%e);left:calc(50% - 50%e)">&#xE005;</div>

    <!-- Bottom area: climb category -->
    <div class="sp-t-s p-hc" style="top:calc(78% - 50%e);">Category</div>
    <div class="sp-b-m p-hc" style="top:calc(90% - 50%e);">
      <span id="category-value">--</span>
    </div>

    <!-- Simulator-only debug controls: these only affect the fallback gradient
         path when real climb telemetry is unavailable. -->
    <userInput>
      <pushButton name="up" onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');" />
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');" />
    </userInput>

  </div>

</uiView>
