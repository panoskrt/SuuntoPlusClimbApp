<uiView
  onLoad="
    var categorySubscription;
  "
  onActivate="
    // Category text + color per tier, matching main.js's CLIMB_* comments:
    // gray -> green -> blue -> yellow -> orange -> red -> dark red.
    // Colors are hardcoded hex rather than looked up via getStyle('css:.c-x')
    // because not every watch display defines the same named color classes
    // (e.g. plain .c-blue is missing on the newer 'q' display's stylesheet).
    var categoryInfo = [
      { text: 'Flat', color: '#888' },
      { text: 'Cat4', color: '#0F5' },
      { text: 'Cat3', color: '#05F' },
      { text: 'Cat2', color: '#FD3' },
      { text: 'Cat1', color: '#F90' },
      { text: 'HC',   color: '#F00' },
      { text: 'HC+',  color: '#900' }
    ];
    categorySubscription = $.subscribe('Zapp/{zapp_index}/Output/category', function(v) {
      var info = categoryInfo[v] || categoryInfo[0];
      setText('#category-value', info.text);
      setStyle('#category-value', 'color', info.color);
    });
  "
  onDeactivate="
    $.unsubscribe(categorySubscription);
  ">

  <div id="suuntoplus">

    <!-- Top title -->
    <div class="cm-fg" style="width:100%;height:24%;">
      <div class="sp-t-s p-hc" style="top:calc(60% - 50%e);">Cycling Climb Category</div>
    </div>

    <!-- Top-left metric: Gradient -->
    <div class="cm-mid sp-t-s" style="top:calc(38% - 100%e);left:calc(24% - 50%e);">Gradient</div>
    <div class="sp-d-s f-num" style="top:calc(52% - 100%e);left:calc(24% - 50%e);">
      <eval input="/Zapp/{zapp_index}/Output/gradient" outputFormat="Percentage_Fourdigits" default="--"/>%
    </div>

    <!-- Top-right metric: VAM -->
    <div class="cm-mid sp-t-s" style="top:calc(38% - 100%e);left:calc(76% - 50%e);">VAM</div>
    <div style="top:calc(52% - 100%e);left:calc(76% - 50%e);">
      <span class="sp-d-s f-num">
        <eval input="/Zapp/{zapp_index}/Output/vam" outputFormat="VerticalSpeedMountain_Fourdigits" default="--"/>
      </span>
    </div>

    <!-- Bottom-left metric: Max gradient -->
    <div class="cm-mid sp-t-s" style="top:calc(72% - 100%e);left:calc(24% - 50%e);">Max</div>
    <div style="top:calc(86% - 100%e);left:calc(24% - 50%e);">
      <span class="sp-d-s f-num">
        <eval input="/Zapp/{zapp_index}/Output/maxgradient" outputFormat="Percentage_Fourdigits" default="--"/>
      </span>
    </div>

    <!-- Bottom-right metric: Category -->
    <div class="cm-mid sp-t-s" style="top:calc(72% - 100%e);left:calc(76% - 50%e);">Category</div>
    <div class="sp-b-m p-hc" style="top:calc(86% - 100%e);left:calc(76% - 50%e);">
      <span id="category-value">--</span>
    </div>
  </div>

</uiView>
