<uiView>
  <div id="suuntoplus">

    <!-- Title and its background -->
    <div class="cm-fg" style="width:100%;height:18%;">
      <div class="sp-t-m p-hc" style="top:calc(50% - 40%e);">Velo Climb</div>
    </div>

    <!-- vertical separator -->
    <div class="cm-fg p-hc" style="top:20%;width:2px;height:32%;opacity:0.4"></div>

    <!-- top left -->
    <!-- Climb duration -->
    <:if test="{APP_IS_DISPLAY_LARGE}">
        <div class="sp-t-s cm-mid p-hc" style="top:calc(24% - 100%e);left:calc(26% - 50%e)">Climb time</div>
        <div class="f-ico" style="top:calc(32% - 100%e);left:calc(26% - 50%e)">&#xF259;</div>
        <div class="sp-d-m f-num" style="top:calc(42% - 50%e);left:calc(26% - 50%e)">
          <eval input="/Fusion/Altitude/AscentTime" outputFormat="AscentDuration_Fourdigits" default="--"/>
        </div>
    </:if>
    <:else>
        <div class="sp-t-s cm-mid" style="top:19%;left:3%;width:46%;text-align:center;">Climb time</div>
        <div style="top:27%;left:3%;width:46%;height:24%">
          <div class="p-hc sp-vertical-center">
            <span class="f-ico" style="padding-right:4px">&#xF259;</span>
            <span class="sp-d-s f-num">
              <eval input="/Fusion/Altitude/AscentTime" outputFormat="AscentDuration_Fourdigits" default="--"/>
            </span>
          </div>
        </div>
    </:else>

    <!-- top right -->
    <!-- Average gradient -->
    <:if test="{APP_IS_DISPLAY_LARGE}">
        <div class="sp-t-s cm-mid p-hc" style="top:calc(24% - 100%e);left:calc(74% - 50%e)">Avg grad</div>
        <div class="sp-d-m" style="top:calc(32% - 100%e);left:calc(74% - 50%e)">%</div>
        <div class="sp-d-m f-num" style="top:calc(42% - 50%e);left:calc(74% - 50%e)">
          <eval input="/Zapp/{zapp_index}/Output/avgGradient" outputFormat="Percentage_Fourdigits" default="--"/>
        </div>
    </:if>
    <:else>
        <div class="sp-t-s cm-mid" style="top:19%;left:51%;width:46%;text-align:center;">Avg grad</div>
        <div style="top:27%;left:51%;width:46%;height:24%">
          <div class="p-hc sp-vertical-center">
            <span class="sp-d-s" style="padding-right:4px">%</span>
            <span class="sp-d-s f-num">
              <eval input="/Zapp/{zapp_index}/Output/avgGradient" outputFormat="Percentage_Fourdigits" default="--"/>
            </span>
          </div>
        </div>
    </:else>

    <!-- bottom: altitude profile graph -->
    <!-- Kept well inside the round bezel: at width:84%/height:30% the box's
         right and bottom edges fell outside the circular display area, which
         is why the grid-line labels near the bottom-right were being clipped. -->
    <div id="graph" style="left:13%; top:55%; width:72%; height:26%;">
      <graph style="position:absolute;
                    left:0; top:0; width:100%; height:100%;
                    box-sizing: border-box;
                    padding-right:30px;
                    font-size:8px;
                    fill-color:rgba(255, 0, 0, 0.7);"
            valueFormat="Altitude_Fourdigits"
            type="line"
            grid="three lines"
            inputType="subscribe"
            input="/Activity/Move/-1/Altitude/Current"
            min="0"/>
    </div>

    <userInput>
      <!-- Switch view when lower button is pressed -->
      <pushButton name="up" onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');" />
    </userInput>

  </div>

</uiView>
